<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة المجموعات (بدون Firebase)</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      text-align: center;
      background: linear-gradient(to right, #6dd5fa, #2980b9);
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container { padding: 40px 20px; }
    .card {
      display: inline-block;
      width: 150px;
      height: 100px;
      background-color: #ffffff;
      color: #2c3e50;
      line-height: 100px;
      border-radius: 12px;
      margin: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.1); }
    input, textarea {
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      width: 80%;
      margin: 10px auto;
      display: block;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    button:hover { background-color: #1e8449; }
    .hidden { display: none; }
    .box {
      background-color: rgba(255,255,255,0.9);
      color: #2c3e50;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="selectGroupSection" class="box">
    <h1>اختر مجموعتك</h1>
    <div>
      <div class="card" onclick="selectGroup('group1')">المجموعة الأولى</div>
      <div class="card" onclick="selectGroup('group2')">المجموعة الثانية</div>
    </div>
  </div>

  <div id="nameInputSection" class="box hidden">
    <h2>أدخل اسم مجموعتك</h2>
    <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
    <button onclick="saveGroupName()">تأكيد</button>
  </div>

  <div id="gameSection" class="box hidden">
    <h2 id="groupsDisplay">📊 أسماء المجموعات ستظهر هنا</h2>
    <div id="turnInfo">معلومات الدور ستظهر هنا</div>
  </div>

</div>

<script>
  let myGroup = "";

  function selectGroup(group) {
    myGroup = group;
    document.getElementById('selectGroupSection').classList.add('hidden');
    document.getElementById('nameInputSection').classList.remove('hidden');
  }

  function saveGroupName() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (name === "") {
      alert("أدخل اسم المجموعة");
      return;
    }
    document.getElementById('nameInputSection').classList.add('hidden');
    document.getElementById('gameSection').classList.remove('hidden');
    document.getElementById('groupsDisplay').innerText = `✅ اخترت ${name}`;
    document.getElementById('turnInfo').innerText = "✨ تجربة ناجحة بدون Firebase";
  }
</script>

</body>
</html>
