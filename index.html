<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة المجموعات</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            color: #333;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .container {
            margin: 40px auto;
            max-width: 600px;
            padding: 30px;
            background-color: #ffffffdd;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input, textarea {
            padding: 10px;
            width: 80%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 16px;
        }
        .hidden { display: none; }
        .group-card {
            display: inline-block;
            width: 40%;
            padding: 30px;
            margin: 15px;
            border-radius: 10px;
            background-color: #f1c40f;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .group-card:hover {
            transform: scale(1.05);
            background-color: #f39c12;
        }
        #questionDisplay, #answerDisplay {
            margin: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="groupSelection" class="container">
    <h1>اختر مجموعتك</h1>
    <div class="group-card" onclick="selectGroup('المجموعة الأولى')">المجموعة الأولى</div>
    <div class="group-card" onclick="selectGroup('المجموعة الثانية')">المجموعة الثانية</div>
</div>

<div id="nameInputSection" class="container hidden">
    <h2 id="selectedGroupTitle"></h2>
    <input type="text" id="groupNameInput" placeholder="أدخل اسم مجموعتك">
    <br>
    <button onclick="saveGroupName()">تأكيد</button>
</div>

<div id="gameSection" class="container hidden">
    <h2 id="groupsDisplay"></h2>

    <div id="questionSection">
        <h3>✍️ اطرح سؤالا للمجموعة الأخرى</h3>
        <textarea id="questionInput" rows="3" placeholder="اكتب سؤالك هنا..."></textarea><br>
        <button onclick="sendQuestion()">أرسل السؤال</button>
    </div>

    <div id="answerSection" class="hidden">
        <h3>📢 السؤال المستلم:</h3>
        <div id="questionDisplay"></div>
        <textarea id="answerInput" rows="2" placeholder="اكتب إجابتك هنا..."></textarea><br>
        <button onclick="sendAnswer()">أرسل الجواب</button>
    </div>

    <div id="answerDisplaySection" class="hidden">
        <h3>📨 الإجابة المستلمة:</h3>
        <div id="answerDisplay"></div>
    </div>
</div>

<script type="module">
// Firebase imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyACiOC6qd0OozfYUKeimW2O6BiH709h_aw",
    authDomain: "jeu-groupes.firebaseapp.com",
    databaseURL: "https://jeu-groupes-default-rtdb.firebaseio.com",
    projectId: "jeu-groupes",
    storageBucket: "jeu-groupes.firebasestorage.app",
    messagingSenderId: "738368275764",
    appId: "1:738368275764:web:f6f580335133cf22cc1161"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let selectedGroup = "";
let group1Name = "";
let group2Name = "";

function selectGroup(group) {
    selectedGroup = group;
    document.getElementById('groupSelection').classList.add('hidden');
    document.getElementById('nameInputSection').classList.remove('hidden');
    document.getElementById('selectedGroupTitle').innerText = `أنت اخترت: ${group}`;
}

function saveGroupName() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name) { alert("أدخل اسم المجموعة"); return; }

    if (selectedGroup === "المجموعة الأولى") {
        set(ref(db, 'groups/group1'), { name: name });
        group1Name = name;
    } else {
        set(ref(db, 'groups/group2'), { name: name });
        group2Name = name;
    }

    document.getElementById('nameInputSection').classList.add('hidden');
    document.getElementById('gameSection').classList.remove('hidden');
    listenForGroups();
    listenForQuestion();
    listenForAnswer();
}

function listenForGroups() {
    onValue(ref(db, 'groups'), (snapshot) => {
        const groups = snapshot.val();
        if (groups) {
            group1Name = groups.group1?.name || "";
            group2Name = groups.group2?.name || "";
            document.getElementById('groupsDisplay').innerText = `${group1Name} 🆚 ${group2Name}`;
        }
    });
}

function sendQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (!question) { alert("اكتب السؤال"); return; }

    set(ref(db, 'questions'), { from: selectedGroup, question: question });
    document.getElementById('questionInput').value = "";
    document.getElementById('questionSection').classList.add('hidden');
}

function listenForQuestion() {
    onValue(ref(db, 'questions'), (snapshot) => {
        const data = snapshot.val();
        if (data && data.from !== selectedGroup) {
            document.getElementById('questionDisplay').innerText = data.question;
            document.getElementById('answerSection').classList.remove('hidden');
        }
    });
}

function sendAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    if (!answer) { alert("اكتب الإجابة"); return; }

    set(ref(db, 'answers'), { from: selectedGroup, answer: answer });
    document.getElementById('answerInput').value = "";
    document.getElementById('answerSection').classList.add('hidden');
}

function listenForAnswer() {
    onValue(ref(db, 'answers'), (snapshot) => {
        const data = snapshot.val();
        if (data && data.from !== selectedGroup) {
            document.getElementById('answerDisplay').innerText = data.answer;
            document.getElementById('answerDisplaySection').classList.remove('hidden');
            document.getElementById('questionSection').classList.remove('hidden');
        }
    });
}
</script>

</body>
</html>
