<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة المجموعات</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background-color: #f0f8ff;
    margin-top: 50px;
    color: #333;
}
.section { margin: 20px; }
h1, h2 { color: #2c3e50; }
button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 10px;
    border-radius: 5px;
    background-color: #3498db;
    color: white;
    cursor: pointer;
}
button:hover { background-color: #2980b9; }
input, textarea {
    padding: 10px;
    font-size: 18px;
    width: 300px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
#timer { font-size: 24px; margin: 20px; }
.hidden { display: none; }
.card {
    display: inline-block;
    width: 150px;
    height: 150px;
    line-height: 150px;
    margin: 20px;
    border-radius: 10px;
    background-color: #3498db;
    color: white;
    font-size: 20px;
    cursor: pointer;
}
.card.selected { background-color: #2ecc71; }
.game-container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<div id="select-section" class="section game-container">
    <h1>اختر مجموعتك</h1>
    <div id="cards">
        <div class="card" onclick="chooseGroup(1)">المجموعة الأولى</div>
        <div class="card" onclick="chooseGroup(2)">المجموعة الثانية</div>
    </div>
    <div id="nameInputSection" class="hidden">
        <h2>أدخل اسم مجموعتك</h2>
        <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
        <br>
        <button onclick="submitGroupName()">تأكيد</button>
    </div>
</div>

<div id="game-section" class="section hidden game-container">
    <h2 id="groupsDisplay"></h2>
    <div class="score-board" id="scoreBoard"></div>

    <div id="turnInfo"></div>

    <div id="questionSection" class="question-area hidden">
        <h3>اكتب سؤالا للمجموعة الأخرى:</h3>
        <textarea id="questionInput" rows="3" placeholder="اكتب سؤالك هنا..."></textarea>
        <br>
        <button onclick="sendQuestion()">أرسل السؤال</button>
    </div>

    <div id="answerSection" class="answer-area hidden">
        <h3 id="receivedQuestion"></h3>
        <textarea id="answerInput" rows="2" placeholder="اكتب إجابتك هنا..."></textarea>
        <br>
        <button onclick="sendAnswer()">أرسل الجواب</button>
    </div>

    <div id="timer"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js";

// إعدادات Firebase
const firebaseConfig = {
    apiKey: "AIzaSyACiOC6qd0OozfYUKeimW2O6BiH709h_aw",
    authDomain: "jeu-groupes.firebaseapp.com",
    databaseURL: "https://jeu-groupes-default-rtdb.firebaseio.com",
    projectId: "jeu-groupes",
    storageBucket: "jeu-groupes.firebasestorage.app",
    messagingSenderId: "738368275764",
    appId: "1:738368275764:web:f6f580335133cf22cc1161"
};

// تهيئة Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let selectedGroup = 0;
let groupName = "";
let group1 = { name: "", score: 0 };
let group2 = { name: "", score: 0 };
let currentTurn = 1;
let timer;
let timeLeft = 30;

function chooseGroup(groupNumber) {
    selectedGroup = groupNumber;
    document.getElementById('cards').classList.add('hidden');
    document.getElementById('nameInputSection').classList.remove('hidden');
}

function submitGroupName() {
    groupName = document.getElementById('groupNameInput').value.trim();
    if (!groupName) {
        alert("أدخل اسم المجموعة!");
        return;
    }

    const groupPath = selectedGroup === 1 ? 'group1' : 'group2';
    set(ref(db, groupPath), { name: groupName, score: 0 });

    document.getElementById('select-section').classList.add('hidden');
    document.getElementById('game-section').classList.remove('hidden');

    listenForGroups();
    checkForQuestion();
}

function listenForGroups() {
    onValue(ref(db, 'group1'), (snapshot) => {
        if (snapshot.exists()) {
            group1 = snapshot.val();
            updateDisplay();
        }
    });
    onValue(ref(db, 'group2'), (snapshot) => {
        if (snapshot.exists()) {
            group2 = snapshot.val();
            updateDisplay();
        }
    });
}

function updateDisplay() {
    if (group1.name && group2.name) {
        document.getElementById('groupsDisplay').innerText = `${group1.name} مقابل ${group2.name}`;
        document.getElementById('scoreBoard').innerText = `${group1.name}: ${group1.score} نقاط - ${group2.name}: ${group2.score} نقاط`;
        showTurn();
    }
}

function showTurn() {
    const isMyTurn = (currentTurn % 2 === 1 && groupName === group1.name) || (currentTurn % 2 === 0 && groupName === group2.name);

    document.getElementById('scoreBoard').innerText = `${group1.name}: ${group1.score} نقاط - ${group2.name}: ${group2.score} نقاط`;

    if (isMyTurn) {
        document.getElementById('turnInfo').innerText = "دورك لطرح سؤال ✍️";
        document.getElementById('questionSection').classList.remove('hidden');
        document.getElementById('answerSection').classList.add('hidden');
        startTimer();
    } else {
        document.getElementById('turnInfo').innerText = "انتظر السؤال من المجموعة الأخرى ⏳";
        document.getElementById('questionSection').classList.add('hidden');
        document.getElementById('answerSection').classList.add('hidden');
    }
}

function sendQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (question) {
        const opponent = groupName === group1.name ? group2.name : group1.name;
        set(ref(db, 'questions/' + opponent), { question: question });
        document.getElementById('questionInput').value = "";
        clearInterval(timer);
        alert("تم إرسال السؤال. انتظر الإجابة.");
    }
}

function checkForQuestion() {
    const questionRef = ref(db, 'questions/' + groupName);
    onValue(questionRef, (snapshot) => {
        if (snapshot.exists()) {
            const question = snapshot.val().question;
            document.getElementById('receivedQuestion').innerText = question;
            document.getElementById('answerSection').classList.remove('hidden');
            startTimer();
        }
    });
}

function sendAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    if (answer) {
        const correct = confirm("هل الإجابة صحيحة؟ اضغط موافق إذا نعم، أو إلغاء إذا لا.");
        if (correct) {
            if (currentTurn % 2 === 1) {
                group2.score++;
                set(ref(db, 'group2/score'), group2.score);
            } else {
                group1.score++;
                set(ref(db, 'group1/score'), group1.score);
            }
        }
        document.getElementById('answerInput').value = "";
        currentTurn++;
        clearInterval(timer);
        showTurn();
    }
}

function startTimer() {
    timeLeft = 30;
    document.getElementById('timer').innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
        if (timeLeft <= 0) {
            clearInterval(timer);
            alert("انتهى الوقت!");
            currentTurn++;
            showTurn();
        }
    }, 1000);
}
</script>

</body>
</html>
