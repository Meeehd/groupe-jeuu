<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة المجموعات</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      text-align: center;
      background: linear-gradient(to right, #6dd5fa, #2980b9);
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container {
      padding: 40px 20px;
    }

    h1, h2, h3 {
      color: #fff;
    }

    .card {
      display: inline-block;
      width: 150px;
      height: 100px;
      background-color: #ffffff;
      color: #2c3e50;
      line-height: 100px;
      border-radius: 12px;
      margin: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.1);
      background-color: #f1f1f1;
    }

    input, textarea {
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      width: 80%;
      margin: 10px auto;
      display: block;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1e8449;
    }

    .hidden {
      display: none;
    }

    .box {
      background-color: rgba(255,255,255,0.9);
      color: #2c3e50;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="selectGroupSection" class="box">
    <h1>اختر مجموعتك</h1>
    <div>
      <div class="card" onclick="selectGroup('group1')">المجموعة الأولى</div>
      <div class="card" onclick="selectGroup('group2')">المجموعة الثانية</div>
    </div>
  </div>

  <div id="nameInputSection" class="box hidden">
    <h2>أدخل اسم مجموعتك</h2>
    <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
    <button onclick="saveGroupName()">تأكيد</button>
  </div>

  <div id="gameSection" class="box hidden">
    <h2 id="groupsDisplay"></h2>
    <div id="turnInfo"></div>

    <div id="questionSection" class="hidden">
      <h3>✍️ اكتب سؤالك:</h3>
      <textarea id="questionInput" rows="3" placeholder="اكتب سؤالك هنا..."></textarea>
      <button onclick="sendQuestion()">إرسال السؤال</button>
    </div>

    <div id="answerSection" class="hidden">
      <h3>📥 السؤال الذي وصلك:</h3>
      <div id="receivedQuestion" style="font-weight: bold; margin-bottom: 15px;"></div>
      <textarea id="answerInput" rows="2" placeholder="اكتب إجابتك هنا..."></textarea>
      <button onclick="sendAnswer()">إرسال الإجابة</button>
    </div>

  </div>

</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACiOC6qd0OozfYUKeimW2O6BiH709h_aw",
    authDomain: "jeu-groupes.firebaseapp.com",
    databaseURL: "https://jeu-groupes-default-rtdb.firebaseio.com",
    projectId: "jeu-groupes",
    storageBucket: "jeu-groupes.appspot.com",
    messagingSenderId: "738368275764",
    appId: "1:738368275764:web:f6f580335133cf22cc1161"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myGroup = "";
  let otherGroup = "";
  let myName = "";
  let currentTurn = "group1";

  function selectGroup(group) {
    myGroup = group;
    otherGroup = (group === "group1") ? "group2" : "group1";
    document.getElementById('selectGroupSection').classList.add('hidden');
    document.getElementById('nameInputSection').classList.remove('hidden');
  }

  function saveGroupName() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (name === "") {
      alert("أدخل اسم المجموعة");
      return;
    }
    myName = name;
    set(ref(db, 'groups/' + myGroup), {
      name: name
    });
    document.getElementById('nameInputSection').classList.add('hidden');
    document.getElementById('gameSection').classList.remove('hidden');
    updateGroupsDisplay();
    listenTurn();
    listenForQuestion();
  }

  function updateGroupsDisplay() {
    const group1Ref = ref(db, 'groups/group1');
    const group2Ref = ref(db, 'groups/group2');

    get(group1Ref).then(snap1 => {
      const name1 = snap1.exists() ? snap1.val().name : "المجموعة ١";
      get(group2Ref).then(snap2 => {
        const name2 = snap2.exists() ? snap2.val().name : "المجموعة ٢";
        document.getElementById('groupsDisplay').innerText = `${name1} 🆚 ${name2}`;
      });
    });
  }

  function listenTurn() {
    const turnRef = ref(db, 'currentTurn');
    onValue(turnRef, (snapshot) => {
      if (snapshot.exists()) {
        currentTurn = snapshot.val();
        updateUIBasedOnTurn();
      } else {
        set(turnRef, "group1"); // تعيين البداية
      }
    });
  }

  function updateUIBasedOnTurn() {
    if (currentTurn === myGroup) {
      document.getElementById('turnInfo').innerText = "🔔 دورك لطرح سؤال";
      document.getElementById('questionSection').classList.remove('hidden');
      document.getElementById('answerSection').classList.add('hidden');
    } else {
      document.getElementById('turnInfo').innerText = "⏳ انتظر السؤال من المجموعة الأخرى";
      document.getElementById('questionSection').classList.add('hidden');
      document.getElementById('answerSection').classList.add('hidden');
    }
  }

  function sendQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (question === "") {
      alert("اكتب سؤالًا!");
      return;
    }
    set(ref(db, 'questions/' + otherGroup), {
      question: question
    });
    document.getElementById('questionInput').value = "";
    alert("تم إرسال السؤال!");
  }

  function listenForQuestion() {
    const myQuestionRef = ref(db, 'questions/' + myGroup);
    onValue(myQuestionRef, (snapshot) => {
      if (snapshot.exists() && snapshot.val() && snapshot.val().question && snapshot.val().question.trim() !== "") {
        const q = snapshot.val().question;
        document.getElementById('receivedQuestion').innerText = q;
        document.getElementById('answerSection').classList.remove('hidden');
      } else {
        document.getElementById('answerSection').classList.add('hidden');
        document.getElementById('receivedQuestion').innerText = "";
      }
    });
  }

  function sendAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    if (answer === "") {
      alert("اكتب إجابتك!");
      return;
    }
    alert("تم إرسال الإجابة: " + answer);
    document.getElementById('answerInput').value = "";
    clearQuestion();
    switchTurn();
  }

  function clearQuestion() {
    set(ref(db, 'questions/' + myGroup), {
      question: ""
    });
  }

  function switchTurn() {
    const nextTurn = (currentTurn === "group1") ? "group2" : "group1";
    set(ref(db, 'currentTurn'), nextTurn);
  }

</script>

</body>
</html>
