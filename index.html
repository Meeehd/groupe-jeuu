<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة المجموعات بالتناوب</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
      color: #333;
      text-align: center;
      padding: 30px;
    }

    h1, h2, h3 {
      color: #2c3e50;
    }

    .card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      padding: 30px;
      margin: 20px auto;
      width: 250px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background-color: #f0f8ff;
    }

    button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #1c5980;
    }

    input, textarea {
      padding: 10px;
      width: 80%;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    .group-name {
      font-size: 22px;
      margin: 15px 0;
      color: #16a085;
    }

    .question-box, .answer-box {
      background: #ffffff;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

  </style>
</head>

<body>

  <h1>🎮 لعبة الأسئلة بين المجموعتين (تناوب الأدوار)</h1>

  <div id="selectGroup">
    <h2>اختر مجموعتك</h2>
    <div class="card" onclick="chooseGroup('group1')">المجموعة الأولى</div>
    <div class="card" onclick="chooseGroup('group2')">المجموعة الثانية</div>
  </div>

  <div id="nameInputSection" class="hidden">
    <h2 id="selectedGroupText"></h2>
    <input type="text" id="groupNameInput" placeholder="اكتب اسم مجموعتك">
    <br>
    <button onclick="submitGroupName()">تأكيد الاسم</button>
  </div>

  <div id="gameSection" class="hidden">
    <h2>👥 المواجهة</h2>
    <div class="group-name" id="groupsDisplay"></div>

    <div id="turnIndicator" style="font-weight: bold; margin-bottom: 20px;"></div>

    <div id="questionSection" class="question-box hidden">
      <h3>✍️ اكتب سؤالاً للمجموعة الأخرى</h3>
      <textarea id="questionInput" rows="3" placeholder="اكتب سؤالك هنا..."></textarea><br>
      <button onclick="sendQuestion()">📤 أرسل السؤال</button>
    </div>

    <div id="answerSection" class="answer-box hidden">
      <h3>📥 السؤال الذي وصلك:</h3>
      <div id="receivedQuestion" style="font-weight: bold; margin: 10px 0;"></div>
      <textarea id="answerInput" rows="2" placeholder="اكتب إجابتك هنا..."></textarea><br>
      <button onclick="sendAnswer()">📤 أرسل الجواب</button>
    </div>

    <div id="receivedAnswerSection" class="answer-box hidden">
      <h3>✅ جواب المجموعة الأخرى:</h3>
      <div id="receivedAnswer" style="font-weight: bold; margin: 10px 0;"></div>
    </div>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js";

// Firebase config (استخدم بيانات مشروعك)
const firebaseConfig = {
  apiKey: "AIzaSyACiOC6qd0OozfYUKeimW2O6BiH709h_aw",
  authDomain: "jeu-groupes.firebaseapp.com",
  databaseURL: "https://jeu-groupes-default-rtdb.firebaseio.com",
  projectId: "jeu-groupes",
  storageBucket: "jeu-groupes.appspot.com",
  messagingSenderId: "738368275764",
  appId: "1:738368275764:web:f6f580335133cf22cc1161"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myGroup = "";
let otherGroup = "";
let myGroupName = "";
let otherGroupName = "";

function chooseGroup(group) {
  myGroup = group;
  otherGroup = (group === 'group1') ? 'group2' : 'group1';
  document.getElementById('selectGroup').classList.add('hidden');
  document.getElementById('nameInputSection').classList.remove('hidden');
  document.getElementById('selectedGroupText').innerText = (group === 'group1') ? "🟥 اخترت المجموعة الأولى" : "🟦 اخترت المجموعة الثانية";
}

window.chooseGroup = chooseGroup;

function submitGroupName() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (name.length < 1) { alert("اكتب اسم المجموعة!"); return; }

  myGroupName = name;
  set(ref(db, 'groups/' + myGroup), { name: name });
  listenToOtherGroupName();
  document.getElementById('nameInputSection').classList.add('hidden');
  document.getElementById('gameSection').classList.remove('hidden');

  checkIfBothGroupsReady();
}

window.submitGroupName = submitGroupName;

function listenToOtherGroupName() {
  const otherGroupRef = ref(db, 'groups/' + otherGroup);
  onValue(otherGroupRef, (snapshot) => {
    if (snapshot.exists()) {
      otherGroupName = snapshot.val().name;
      updateGroupDisplay();
    }
  });
}

function updateGroupDisplay() {
  let text = `${myGroupName} 🆚 ${otherGroupName}`;
  document.getElementById('groupsDisplay').innerText = text;
}

function checkIfBothGroupsReady() {
  const groupsRef = ref(db, 'groups/');
  get(groupsRef).then(snapshot => {
    if (snapshot.exists()) {
      const groups = snapshot.val();
      if (groups.group1 && groups.group2) {
        // يبدأ الدور للمجموعة الأولى تلقائياً
        set(ref(db, 'currentTurn'), 'group1');
      }
    }
  });
}

// تحديث حالة الدور
const turnRef = ref(db, 'currentTurn');
onValue(turnRef, (snapshot) => {
  if (snapshot.exists()) {
    const turn = snapshot.val();
    updateUIForTurn(turn);
  }
});

function updateUIForTurn(turn) {
  const turnIndicator = document.getElementById('turnIndicator');
  if (turn === myGroup) {
    turnIndicator.innerText = "🔴 دورك لطرح السؤال";
    document.getElementById('questionSection').classList.remove('hidden');
    document.getElementById('answerSection').classList.add('hidden');
  } else {
    turnIndicator.innerText = "⏳ انتظر المجموعة الأخرى...";
    document.getElementById('questionSection').classList.add('hidden');
  }
}

function sendQuestion() {
  const question = document.getElementById('questionInput').value.trim();
  if (question.length < 1) { alert("اكتب سؤالك!"); return; }

  set(ref(db, 'questions/' + otherGroup), { question: question });
  document.getElementById('questionInput').value = "";
  document.getElementById('questionSection').classList.add('hidden');
}

window.sendQuestion = sendQuestion;

// استقبال السؤال
const myQuestionRef = ref(db, 'questions/' + myGroup);
onValue(myQuestionRef, (snapshot) => {
  if (snapshot.exists()) {
    const q = snapshot.val().question;
    document.getElementById('receivedQuestion').innerText = q;
    document.getElementById('answerSection').classList.remove('hidden');
  } else {
    document.getElementById('answerSection').classList.add('hidden');
  }
});

function sendAnswer() {
  const answer = document.getElementById('answerInput').value.trim();
  if (answer.length < 1) { alert("اكتب إجابتك!"); return; }

  set(ref(db, 'answers/' + otherGroup), { answer: answer });
  document.getElementById('answerInput').value = "";
  document.getElementById('answerSection').classList.add('hidden');

  // بعد إرسال الجواب، يُعطى الدور للمجموعة الأخرى
  set(ref(db, 'currentTurn'), otherGroup);
}

window.sendAnswer = sendAnswer;

// استقبال الإجابة
const myAnswerRef = ref(db, 'answers/' + myGroup);
onValue(myAnswerRef, (snapshot) => {
  if (snapshot.exists()) {
    const a = snapshot.val().answer;
    document.getElementById('receivedAnswer').innerText = a;
    document.getElementById('receivedAnswerSection').classList.remove('hidden');

    // تنظيف الأسئلة والإجابات القديمة
    remove(ref(db, 'questions/' + myGroup));
    remove(ref(db, 'answers/' + myGroup));
  } else {
    document.getElementById('receivedAnswerSection').classList.add('hidden');
  }
});
</script>

</body>
</html>
