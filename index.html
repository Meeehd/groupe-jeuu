<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🎮 لعبة المجموعات التفاعلية</title>
<style>
body {
  font-family: 'Tajawal', sans-serif;
  background: linear-gradient(to right, #2193b0, #6dd5ed);
  color: #fff;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 2.5em;
  margin-bottom: 20px;
}

.card {
  display: inline-block;
  background: #ffffff;
  color: #333;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  padding: 20px;
  margin: 15px;
  width: 180px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

button {
  padding: 12px 24px;
  background-color: #ff9800;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s;
  margin-top: 10px;
}

button:hover {
  background-color: #f57c00;
}

input {
  padding: 12px;
  width: 70%;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
  font-size: 16px;
}

.hidden {
  display: none;
}

#groupsDisplay {
  font-size: 1.5em;
  margin: 20px 0;
}

#turnInfo {
  font-size: 1.3em;
  margin-bottom: 15px;
}

#questionSection, #answerSection {
  background: rgba(255,255,255,0.9);
  color: #333;
  padding: 20px;
  border-radius: 15px;
  margin: 20px auto;
  width: 80%;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

label {
  font-weight: bold;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>

<h1>🎮 لعبة المجموعات التفاعلية</h1>

<section id="selectGroupSection">
    <div class="card">
        <h2>🟢 المجموعة الأولى</h2>
        <button onclick="selectGroup('group1')">اختيار</button>
    </div>
    <div class="card">
        <h2>🔵 المجموعة الثانية</h2>
        <button onclick="selectGroup('group2')">اختيار</button>
    </div>
</section>

<section id="enterNameSection" class="hidden">
    <h2 id="selectedGroupLabel"></h2>
    <input type="text" id="groupNameInput" placeholder="📝 أدخل اسم مجموعتك"><br>
    <button onclick="submitGroupName()">تأكيد اسم المجموعة</button>
</section>

<section id="gameSection" class="hidden">
    <h2 id="groupsDisplay"></h2>
    <h3 id="turnInfo"></h3>

    <div id="questionSection" class="hidden">
        <label>❓ اكتب سؤالك:</label><br>
        <input type="text" id="questionInput" placeholder="اكتب سؤالك هنا"><br>
        <button onclick="sendQuestion()">إرسال السؤال</button>
    </div>

    <div id="answerSection" class="hidden">
        <h3 id="receivedQuestion"></h3>
        <label>✏️ اكتب الإجابة:</label><br>
        <input type="text" id="answerInput" placeholder="اكتب الإجابة هنا"><br>
        <button onclick="sendAnswer()">إرسال الإجابة</button>
    </div>
</section>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyACiOC6qd0OozfYUKeimW2O6BiH709h_aw",
    authDomain: "jeu-groupes.firebaseapp.com",
    databaseURL: "https://jeu-groupes-default-rtdb.firebaseio.com",
    projectId: "jeu-groupes",
    storageBucket: "jeu-groupes.appspot.com",
    messagingSenderId: "738368275764",
    appId: "1:738368275764:web:f6f580335133cf22cc1161"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let selectedGroup = "";
let groupName = "";
let opponentGroup = "";
let currentTurn = 1;
let groups = { group1: { name: "", score: 0 }, group2: { name: "", score: 0 } };

function selectGroup(group) {
    selectedGroup = group;
    opponentGroup = group === "group1" ? "group2" : "group1";
    document.getElementById('selectGroupSection').classList.add('hidden');
    document.getElementById('enterNameSection').classList.remove('hidden');
    document.getElementById('selectedGroupLabel').innerText = group === "group1" ? "🟢 أنت في المجموعة الأولى" : "🔵 أنت في المجموعة الثانية";
}

function submitGroupName() {
    groupName = document.getElementById('groupNameInput').value.trim();
    if (!groupName) { alert("أدخل اسم المجموعة"); return; }

    db.ref('groups/' + selectedGroup).set({ name: groupName, score: 0 });

    document.getElementById('enterNameSection').classList.add('hidden');
    waitForBothGroups();
}

function waitForBothGroups() {
    const groupsRef = db.ref('groups');
    groupsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data?.group1?.name && data?.group2?.name) {
            groups.group1.name = data.group1.name;
            groups.group2.name = data.group2.name;
            startGame();
        }
    });
}

function startGame() {
    document.getElementById('gameSection').classList.remove('hidden');
    showTurn();
    listenForQuestion();
}

function showTurn() {
    document.getElementById('groupsDisplay').innerText = `${groups.group1.name} 🆚 ${groups.group2.name}`;
    if ((currentTurn % 2 === 1 && selectedGroup === "group1") || (currentTurn % 2 === 0 && selectedGroup === "group2")) {
        document.getElementById('turnInfo').innerText = "🚀 دورك لطرح سؤال";
        document.getElementById('questionSection').classList.remove('hidden');
        document.getElementById('answerSection').classList.add('hidden');
    } else {
        document.getElementById('turnInfo').innerText = "⏳ انتظر سؤال المجموعة الأخرى";
        document.getElementById('questionSection').classList.add('hidden');
        document.getElementById('answerSection').classList.add('hidden');
    }
}

function sendQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (!question) { alert("اكتب السؤال"); return; }

    db.ref('questions').set({ from: selectedGroup, question: question });
    document.getElementById('questionInput').value = "";
}

function listenForQuestion() {
    const questionRef = db.ref('questions');
    questionRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && data.from !== selectedGroup) {
            document.getElementById('receivedQuestion').innerText = `📢 السؤال: ${data.question}`;
            document.getElementById('answerSection').classList.remove('hidden');
        }
    });
}

function sendAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    if (!answer) { alert("اكتب الإجابة"); return; }

    const correct = confirm("هل الإجابة صحيحة؟ موافق = نعم");
    if (correct) {
        groups[opponentGroup].score++;
        db.ref('groups/' + opponentGroup).set({
            name: groups[opponentGroup].name,
            score: groups[opponentGroup].score
        });
    }

    document.getElementById('answerInput').value = "";
    currentTurn++;
    showTurn();
}
</script>

</body>
</html>
